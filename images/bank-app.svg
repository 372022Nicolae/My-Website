<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" rx="16" fill="#0f172a"/>
  <!-- Bank Card -->
  <defs>
    <linearGradient id="bankGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2be8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect x="30" y="45" width="240" height="135" rx="14" fill="url(#bankGradient)"/>
  <rect x="55" y="70" width="35" height="26" rx="5" fill="#f59e0b"/>
  <text x="55" y="145" font-family="monospace" font-size="14" fill="#ffffff" letter-spacing="2">•••• 8842</text>
  <text x="200" y="75" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">BANK</text>
  <!-- Transaction Log -->
  <rect x="30" y="200" width="240" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="55" cy="230" r="14" fill="#22c55e" opacity="0.2"/>
  <text x="50" y="236" font-family="sans-serif" font-weight="bold" font-size="16" fill="#22c55e">+</text>
  <text x="80" y="225" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Deposit Received</text>
  <text x="80" y="242" font-family="monospace" font-size="11" fill="#94a3b8">+$500.00 | Account #1</text>
</svg>
